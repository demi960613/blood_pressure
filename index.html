<!DOCTYPE html>
<html lang="zh-TW" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血壓紀錄追蹤系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自定義樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body id="appBody" class="text-slate-800 dark:text-slate-100 min-h-screen p-2 sm:p-6 bg-slate-50 dark:bg-slate-900 flex flex-col items-center">

    <!-- 主程式容器 -->
    <div id="appViewportContainer" class="w-full viewport-desktop space-y-4 transition-all duration-300">
        
        <!-- 頂部標題與控制下拉選單區 -->
        <header class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div>
                <h1 class="text-lg sm:text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-heart-pulse text-rose-500"></i> 血壓記錄管理系統
                </h1>
                <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">輕鬆記錄與追蹤您與家人的健康數據</p>
            </div>
            
            <!-- 右側並排下拉選單群組 -->
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 dark:border-slate-700/60">
                <!-- 1. 裝置檢視下拉選單 -->
                <div class="flex items-center gap-1 flex-1 sm:flex-none">
                    <label for="deviceSelector" class="text-xs font-medium text-slate-400 dark:text-slate-500 shrink-0">
                        <i class="fa-solid fa-display text-indigo-500"></i>
                    </label>
                    <select id="deviceSelector" onchange="setDeviceView(this.value)" class="w-full sm:w-auto bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-rose-500 cursor-pointer">
                        <option value="desktop">💻 電腦模式</option>
                        <option value="tablet">📱 平板模式</option>
                        <option value="mobile">📱 手機模式</option>
                    </select>
                </div>

                <!-- 2. 風格主題下拉選單 -->
                <div class="flex items-center gap-1 flex-1 sm:flex-none">
                    <label for="themeSelector" class="text-xs font-medium text-slate-400 dark:text-slate-500 shrink-0">
                        <i id="themeIcon" class="fa-solid fa-palette text-rose-500"></i>
                    </label>
                    <select id="themeSelector" onchange="changeTheme(this.value)" class="w-full sm:w-auto bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-rose-500 cursor-pointer">
                        <option value="slate">預設石墨灰</option>
                        <option value="rose">柔和粉紅</option>
                        <option value="blue">清新天藍</option>
                        <option value="emerald">薄荷翠綠</option>
                        <option value="amber">暖心琥珀</option>
                        <option value="dark">🌙 深夜模式</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- 1. 成員選擇（單一行橫排顯示） -->
        <section class="bg-white dark:bg-slate-800 px-4 py-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <span class="text-xs font-medium text-slate-400 dark:text-slate-500 shrink-0">當前檢視：</span>
                
                <div class="relative flex-1 min-w-0 max-w-[160px] sm:max-w-[200px]">
                    <button onclick="toggleMemberDropdown()" class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center justify-between gap-1.5 cursor-pointer border border-slate-200 dark:border-slate-600">
                        <span class="flex items-center gap-1.5 truncate">
                            <i class="fa-solid fa-circle-user text-rose-500 text-xs"></i>
                            <span id="selectedMemberLabel" class="truncate">平平</span>
                        </span>
                        <i class="fa-solid fa-chevron-down text-[10px] opacity-50 shrink-0"></i>
                    </button>

                    <div id="memberDropdown" class="hidden absolute left-0 right-0 mt-1 w-48 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/80 z-30 py-2 text-xs">
                        <div class="px-3 py-1 text-[10px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">切換成員</div>
                        <div id="memberDropdownList" class="max-h-40 overflow-y-auto"></div>
                        <div class="my-1 border-t border-slate-100 dark:border-slate-700/60"></div>
                        <button onclick="openMemberModal(); toggleMemberDropdown();" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-2 text-indigo-500 font-semibold cursor-pointer">
                            <i class="fa-solid fa-gear w-3"></i> 管理與新增...
                        </button>
                    </div>
                </div>
            </div>

            <button onclick="openMemberModal()" class="text-xs font-medium text-slate-500 hover:text-indigo-500 dark:text-slate-400 dark:hover:text-indigo-400 flex items-center gap-1.5 transition cursor-pointer px-2.5 py-1.5 bg-slate-50 dark:bg-slate-700/40 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl border border-slate-200/60 dark:border-slate-600/60 shrink-0">
                <i class="fa-solid fa-users-gear text-xs text-indigo-500"></i>
                <span class="hidden sm:inline">管理與新增成員</span>
                <span class="inline sm:hidden">管理</span>
            </button>
        </section>

        <!-- 2. 可收納式血壓輸入表單 -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 overflow-hidden">
            <div onclick="toggleForm()" class="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition gap-2">
                <h2 class="text-xs sm:text-sm font-semibold flex items-center gap-1.5 truncate">
                    <i class="fa-solid fa-pen-nib text-rose-500 shrink-0"></i> 
                    <span class="truncate"><span id="formTitleText">記錄</span> <span id="currentMemberName" class="font-bold transition-colors duration-300 text-rose-500"></span> 的血壓</span>
                </h2>
                <button type="button" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-medium px-2.5 py-1 rounded-xl flex items-center gap-1 shadow-sm transition shrink-0">
                    <i id="toggleFormIcon" class="fa-solid fa-plus text-[10px]"></i>
                    <span id="toggleFormText">新增</span>
                </button>
            </div>

            <div id="formContainer" class="hidden px-4 pb-4 pt-1 border-t border-slate-100 dark:border-slate-700/60">
                <form id="recordForm" onsubmit="saveRecord(event)" class="flex flex-col gap-3">
                    <input type="hidden" id="editIndex" value="-1">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 dark:text-slate-400 mb-0.5">測量日期</label>
                        <input type="date" id="recordDate" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 dark:text-slate-400 mb-0.5">收縮壓 (SYS)</label>
                            <input type="number" id="sysInput" placeholder="120" required min="50" max="250" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 dark:text-slate-400 mb-0.5">舒張壓 (DIA)</label>
                            <input type="number" id="diaInput" placeholder="80" required min="30" max="150" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 dark:text-slate-400 mb-0.5">脈搏 (Pulse bpm)</label>
                        <input type="number" id="pulseInput" placeholder="72" min="30" max="200" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div class="flex flex-wrap justify-end gap-2 pt-1">
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 font-medium px-3 py-1.5 rounded-xl text-xs transition cursor-pointer">
                            取消
                        </button>
                        <button type="button" onclick="clearFormInputs()" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 font-medium px-3 py-1.5 rounded-xl text-xs transition cursor-pointer border border-slate-200 dark:border-slate-600">
                            清空
                        </button>
                        <button type="submit" id="submitBtn" class="bg-rose-500 hover:bg-rose-600 text-white font-medium px-5 py-1.5 rounded-xl text-xs transition shadow-sm cursor-pointer">
                            儲存記錄
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 3. 歷史測量紀錄清單（整合月份與狀態雙重篩選） -->
        <section class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 space-y-3">
            <div class="flex flex-col gap-2.5">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="text-xs sm:text-sm font-semibold flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-table-list text-indigo-500"></i> 歷史紀錄
                    </h2>
                    
                    <!-- 篩選選單群組 (月份 + 狀態) -->
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <!-- 月份篩選 -->
                        <select id="monthFilter" onchange="render()" class="bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl px-2 py-1 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-rose-500 max-w-[120px]">
                            <option value="all">全部月份</option>
                        </select>

                        <!-- 狀態過濾選單 -->
                        <select id="statusFilter" onchange="render()" class="bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl px-2 py-1 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-rose-500 max-w-[120px]">
                            <option value="all">全部狀態</option>
                            <option value="normal">正常</option>
                            <option value="normal-high">正常高值</option>
                            <option value="stage1">輕度高血壓</option>
                            <option value="danger">偏高/危險</option>
                            <option value="low">低血壓</option>
                        </select>
                    </div>
                </div>

                <div class="relative w-full">
                    <button onclick="toggleBackupMenu()" class="w-full justify-between bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5 cursor-pointer border border-slate-200 dark:border-slate-600">
                        <span class="flex items-center gap-1.5 truncate">
                            <i class="fa-solid fa-arrows-up-down text-rose-500"></i> 資料備份
                        </span>
                        <i class="fa-solid fa-chevron-down text-[10px] opacity-60"></i>
                    </button>
                    
                    <div id="backupDropdown" class="hidden absolute right-0 left-0 mt-1 w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/80 z-20 py-2 text-xs">
                        <div class="px-3 py-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">個人紀錄</div>
                        <button onclick="exportSingleMemberCSV(); toggleBackupMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                            <i class="fa-solid fa-user-arrow-down text-rose-500 w-4"></i> 匯出個人紀錄
                        </button>
                        <label class="w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-2 text-slate-700 dark:text-slate-200 cursor-pointer">
                            <i class="fa-solid fa-user-arrow-up text-rose-500 w-4"></i> 匯入個人紀錄
                            <input type="file" id="importSingleFile" accept=".csv" onchange="importSingleMemberCSV(event); toggleBackupMenu();" class="hidden">
                        </label>
                        <div class="my-1 border-t border-slate-100 dark:border-slate-700/60"></div>
                        <div class="px-3 py-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">全家總打包</div>
                        <button onclick="exportAllMembersCSV(); toggleBackupMenu();" class="w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                            <i class="fa-solid fa-users-rectangle text-rose-500 w-4"></i> 匯出全家總表
                        </button>
                        <label class="w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-2 text-slate-700 dark:text-slate-200 cursor-pointer">
                            <i class="fa-solid fa-file-arrow-up text-rose-500 w-4"></i> 智慧匯入全家總表
                            <input type="file" id="importAllFile" accept=".csv" onchange="importAllMembersCSV(event); toggleBackupMenu();" class="hidden">
                        </label>
                    </div>
                </div>
            </div>

            <!-- 月統計卡片 -->
            <div id="monthlyStats" class="bg-slate-50 dark:bg-slate-700/30 p-3 rounded-xl flex flex-col gap-2 text-xs"></div>

            <!-- 歷史表格區域 -->
            <div class="overflow-x-auto table-responsive -mx-4 px-4">
                <table class="w-full text-left text-xs min-w-[420px]">
                    <thead>
                        <tr class="border-b border-slate-100 dark:border-slate-700/60 text-slate-400 font-medium">
                            <th class="py-2 px-2">日期</th>
                            <th class="py-2 px-2">收縮/舒張</th>
                            <th class="py-2 px-2">脈搏</th>
                            <th class="py-2 px-2">狀態</th>
                            <th class="py-2 px-2 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody"></tbody>
                </table>
            </div>
        </section>

        <!-- 4. 血壓趨勢圖（含時間範圍切換） -->
        <section class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60">
            <div class="flex items-center justify-between gap-2 mb-3">
                <h2 class="text-xs sm:text-sm font-semibold flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-chart-line text-blue-500"></i> 血壓趨勢圖
                </h2>
                
                <div class="inline-flex bg-slate-100 dark:bg-slate-700/60 p-0.5 rounded-xl border border-slate-200/60 dark:border-slate-600/60 text-[11px] shrink-0">
                    <button onclick="setChartRange('7')" id="btnChart7" class="px-2 py-0.5 rounded-lg font-medium transition cursor-pointer text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">7天</button>
                    <button onclick="setChartRange('30')" id="btnChart30" class="px-2 py-0.5 rounded-lg font-bold transition cursor-pointer bg-white dark:bg-slate-800 text-blue-500 shadow-xs">30天</button>
                    <button onclick="setChartRange('90')" id="btnChart90" class="px-2 py-0.5 rounded-lg font-medium transition cursor-pointer text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">90天</button>
                    <button onclick="setChartRange('all')" id="btnChartAll" class="px-2 py-0.5 rounded-lg font-medium transition cursor-pointer text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">全部</button>
                </div>
            </div>
            <div class="w-full h-48 sm:h-64">
                <canvas id="bloodPressureChart"></canvas>
            </div>
        </section>

    </div>

    <!-- 成員管理 Modal 對話框 -->
    <div id="memberModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-900/40 modal-backdrop">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 w-full max-w-sm p-4 space-y-3">
            <div class="flex items-center justify-between border-b pb-2.5 border-slate-100 dark:border-slate-700/60">
                <h3 class="text-xs font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-users-gear text-rose-500"></i> 成員管理與新增
                </h3>
                <button onclick="closeMemberModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition cursor-pointer p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="space-y-1">
                <label class="block text-[11px] font-medium text-slate-400">新增成員</label>
                <div class="flex gap-2">
                    <input type="text" id="newMemberInputModal" placeholder="輸入名字" class="flex-1 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
                    <button onclick="addMemberFromModal()" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition cursor-pointer shrink-0 shadow-sm">
                        新增
                    </button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-[11px] font-medium text-slate-400">現有成員清單</label>
                <div id="modalMemberList" class="space-y-1.5 max-h-44 overflow-y-auto pr-0.5"></div>
            </div>

            <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex justify-end">
                <button onclick="closeMemberModal()" class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-1.5 rounded-xl text-xs font-medium transition cursor-pointer">
                    完成
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let db = JSON.parse(localStorage.getItem('blood_pressure_db')) || {
            members: { "平平": [] },
            currentMember: "平平"
        };
        let currentMember = db.currentMember || "平平";
        let chartInstance = null;
        let currentChartRange = '30';

        window.onload = function() {
            const savedTheme = localStorage.getItem('blood_pressure_theme') || 'slate';
            document.getElementById('themeSelector').value = savedTheme;
            applyTheme(savedTheme);

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('recordDate').max = todayStr;
            document.getElementById('recordDate').valueAsDate = new Date();
            
            initMembers();
            render();
        };

        function setDeviceView(mode) {
            const container = document.getElementById('appViewportContainer');
            container.classList.remove('viewport-mobile', 'viewport-tablet', 'viewport-desktop');

            if (mode === 'mobile') {
                container.classList.add('viewport-mobile');
            } else if (mode === 'tablet') {
                container.classList.add('viewport-tablet');
            } else {
                container.classList.add('viewport-desktop');
            }

            if (chartInstance) {
                setTimeout(() => { chartInstance.resize(); }, 350);
            }
        }

        function setChartRange(range) {
            currentChartRange = range;
            const ranges = ['7', '30', '90', 'all'];
            ranges.forEach(r => {
                const btn = document.getElementById(`btnChart${r === 'all' ? 'All' : r}`);
                if (btn) {
                    if (r === range) {
                        btn.className = "px-2 py-0.5 rounded-lg font-bold transition cursor-pointer bg-white dark:bg-slate-800 text-blue-500 shadow-xs";
                    } else {
                        btn.className = "px-2 py-0.5 rounded-lg font-medium transition cursor-pointer text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                    }
                }
            });

            const records = db.members[currentMember] || [];
            updateChart(records);
        }

        function toggleBackupMenu() {
            document.getElementById('backupDropdown').classList.toggle('hidden');
        }

        function toggleMemberDropdown() {
            document.getElementById('memberDropdown').classList.toggle('hidden');
        }

        document.addEventListener('click', function(e) {
            const backupMenu = document.getElementById('backupDropdown');
            const backupBtn = e.target.closest('button[onclick="toggleBackupMenu()"]');
            if (!backupBtn && backupMenu && !backupMenu.contains(e.target) && !backupMenu.classList.contains('hidden')) {
                backupMenu.classList.add('hidden');
            }

            const memberMenu = document.getElementById('memberDropdown');
            const memberBtn = e.target.closest('button[onclick="toggleMemberDropdown()"]');
            if (!memberBtn && memberMenu && !memberMenu.contains(e.target) && !memberMenu.classList.contains('hidden')) {
                memberMenu.classList.add('hidden');
            }
        });

        function openMemberModal() {
            renderModalMemberList();
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function closeMemberModal() {
            document.getElementById('memberModal').classList.add('hidden');
        }

        function toggleForm(forceOpen = false) {
            const container = document.getElementById('formContainer');
            const icon = document.getElementById('toggleFormIcon');
            const text = document.getElementById('toggleFormText');

            if (forceOpen || container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.className = "fa-solid fa-minus text-[10px]";
                text.textContent = "收合";
            } else {
                container.classList.add('hidden');
                icon.className = "fa-solid fa-plus text-[10px]";
                text.textContent = "新增";
            }
        }

        function changeTheme(themeName) {
            applyTheme(themeName);
            localStorage.setItem('blood_pressure_theme', themeName);
        }

        function applyTheme(themeName) {
            const htmlRoot = document.getElementById('htmlRoot');
            const body = document.getElementById('appBody');
            const icon = document.getElementById('themeIcon');
            const memberNameSpan = document.getElementById('currentMemberName');

            body.classList.remove('bg-slate-50', 'bg-rose-50', 'bg-blue-50', 'bg-emerald-50', 'bg-amber-50');
            
            if (memberNameSpan) {
                memberNameSpan.classList.remove('text-slate-700', 'dark:text-slate-300', 'text-rose-500', 'text-blue-500', 'text-emerald-600', 'text-amber-600', 'text-indigo-400');
            }

            if (themeName === 'dark') {
                htmlRoot.classList.add('dark');
                body.classList.add('bg-slate-900');
                icon.className = "fa-solid fa-moon text-indigo-400";
                if (memberNameSpan) memberNameSpan.classList.add('text-indigo-400');
            } else {
                htmlRoot.classList.remove('dark');
                icon.className = "fa-solid fa-palette text-rose-500";
                switch(themeName) {
                    case 'rose': 
                        body.classList.add('bg-rose-50'); 
                        if (memberNameSpan) memberNameSpan.classList.add('text-rose-500');
                        break;
                    case 'blue': 
                        body.classList.add('bg-blue-50'); 
                        if (memberNameSpan) memberNameSpan.classList.add('text-blue-500');
                        break;
                    case 'emerald': 
                        body.classList.add('bg-emerald-50'); 
                        if (memberNameSpan) memberNameSpan.classList.add('text-emerald-600');
                        break;
                    case 'amber': 
                        body.classList.add('bg-amber-50'); 
                        if (memberNameSpan) memberNameSpan.classList.add('text-amber-600');
                        break;
                    case 'slate': 
                    default: 
                        body.classList.add('bg-slate-50'); 
                        if (memberNameSpan) memberNameSpan.classList.add('text-slate-700', 'dark:text-slate-300');
                        break;
                }
            }
        }

        window.addEventListener('beforeunload', function (e) {
            const sysVal = document.getElementById('sysInput').value;
            const diaVal = document.getElementById('diaInput').value;
            const editIndex = document.getElementById('editIndex').value;
            if ((sysVal !== '' || diaVal !== '') && editIndex === '-1') {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        function initMembers() {
            const dropdownList = document.getElementById('memberDropdownList');
            dropdownList.innerHTML = '';

            if (!db.members[currentMember]) {
                const firstKey = Object.keys(db.members)[0];
                currentMember = firstKey || "平平";
                db.currentMember = currentMember;
            }

            document.getElementById('selectedMemberLabel').textContent = currentMember;
            document.getElementById('currentMemberName').textContent = currentMember;

            for (let member in db.members) {
                let isSelected = (member === currentMember);
                let btn = document.createElement('button');
                btn.type = "button";
                btn.className = `w-full text-left px-3 py-1.5 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/50 transition cursor-pointer ${
                    isSelected ? 'text-rose-500 font-bold bg-rose-50/50 dark:bg-rose-950/30' : 'text-slate-700 dark:text-slate-200'
                }`;
                btn.innerHTML = `
                    <span class="flex items-center gap-1.5 truncate">
                        <i class="fa-solid fa-user text-[10px] ${isSelected ? 'text-rose-500' : 'text-slate-400'}"></i> ${member}
                    </span>
                    ${isSelected ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                `;
                btn.onclick = () => {
                    currentMember = member;
                    db.currentMember = currentMember;
                    saveDB();
                    resetForm();
                    initMembers();
                    initMonthFilter(db.members[currentMember] || []);
                    render();
                    toggleMemberDropdown();
                };
                dropdownList.appendChild(btn);
            }
        }

        function renderModalMemberList() {
            const listContainer = document.getElementById('modalMemberList');
            listContainer.innerHTML = '';

            for (let member in db.members) {
                let div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700/60";
                div.innerHTML = `
                    <span class="text-xs font-semibold flex items-center gap-1.5 truncate">
                        <i class="fa-solid fa-user text-slate-400 text-[10px]"></i> ${member}
                    </span>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="renameMember('${member}')" class="p-1 text-slate-400 hover:text-indigo-500 transition cursor-pointer text-xs" title="重新命名">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        ${Object.keys(db.members).length > 1 ? `
                            <button onclick="deleteMember('${member}')" class="p-1 text-slate-400 hover:text-rose-500 transition cursor-pointer text-xs" title="刪除">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        ` : ''}
                    </div>
                `;
                listContainer.appendChild(div);
            }
        }

        function addMemberFromModal() {
            const input = document.getElementById('newMemberInputModal');
            const name = input.value.trim();
            if (!name) return alert('請輸入名字！');
            if (db.members[name]) return alert('此成員已存在！');

            db.members[name] = [];
            currentMember = name;
            db.currentMember = currentMember;
            saveDB();
            input.value = '';
            initMembers();
            renderModalMemberList();
            initMonthFilter(db.members[currentMember]);
            render();
        }

        function renameMember(oldName) {
            const newName = prompt(`請輸入「${oldName}」的新名字：`, oldName);
            if (!newName) return;
            const trimmedNewName = newName.trim();
            if (trimmedNewName === "") return alert("名字不能為空白！");
            if (db.members[trimmedNewName]) return alert("此名字已存在！");

            db.members[trimmedNewName] = db.members[oldName];
            delete db.members[oldName];

            if (currentMember === oldName) currentMember = trimmedNewName;
            db.currentMember = currentMember;
            saveDB();
            initMembers();
            renderModalMemberList();
            render();
        }

        function deleteMember(member) {
            if (confirm(`確定要刪除「${member}」及其所有紀錄嗎？`)) {
                delete db.members[member];
                const remaining = Object.keys(db.members);
                if (currentMember === member) currentMember = remaining[0];
                db.currentMember = currentMember;
                saveDB();
                resetForm();
                initMembers();
                renderModalMemberList();
                initMonthFilter(db.members[currentMember] || []);
                render();
            }
        }

        function saveDB() { localStorage.setItem('blood_pressure_db', JSON.stringify(db)); }
        function clearFormInputs() {
            document.getElementById('sysInput').value = '';
            document.getElementById('diaInput').value = '';
            document.getElementById('pulseInput').value = '';
        }

        function saveRecord(e) {
            e.preventDefault();
            const date = document.getElementById('recordDate').value;
            const sys = Number(document.getElementById('sysInput').value);
            const dia = Number(document.getElementById('diaInput').value);
            const pulse = Number(document.getElementById('pulseInput').value) || 0;
            const editIndex = Number(document.getElementById('editIndex').value);

            if (sys <= dia) return alert("⚠️ 收縮壓（SYS）必須大於舒張壓（DIA）！");
            const todayStr = new Date().toISOString().split('T')[0];
            if (date > todayStr) return alert("⚠️ 不能選擇未來的日期！");

            if (pulse > 0 && (pulse < 40 || pulse > 180)) {
                if (!confirm(`⚠️ 脈搏為 ${pulse} bpm 似乎偏離常人範圍。確定儲存嗎？`)) return;
            }

            if (!db.members[currentMember]) db.members[currentMember] = [];
            const records = db.members[currentMember];

            if (editIndex === -1) {
                const existRecord = records.find(r => r.date === date);
                if (existRecord) {
                    if (!confirm(`⚠️ 「${currentMember}」在 ${date} 已有紀錄，要直接覆蓋嗎？`)) return;
                    existRecord.sys = sys; existRecord.dia = dia; existRecord.pulse = pulse;
                    records.sort((a, b) => new Date(a.date) - new Date(b.date));
                    saveDB(); resetForm(); initMonthFilter(records); render(); toggleForm(false);
                    alert("🎉 更新成功！");
                    return;
                }
            }

            const selectedMonth = document.getElementById('monthFilter').value;
            const selectedStatus = document.getElementById('statusFilter').value;
            if (editIndex > -1) {
                let filteredRecords = records;
                if (selectedMonth !== 'all') filteredRecords = filteredRecords.filter(r => r.date && r.date.startsWith(selectedMonth));
                if (selectedStatus !== 'all') filteredRecords = filteredRecords.filter(r => getStatusCode(r.sys, r.dia) === selectedStatus);
                
                const target = filteredRecords[editIndex];
                const realIndex = records.indexOf(target);
                if (realIndex > -1) records[realIndex] = { date, sys, dia, pulse };
            } else {
                records.push({ date, sys, dia, pulse });
            }

            records.sort((a, b) => new Date(a.date) - new Date(b.date));
            saveDB(); resetForm(); initMonthFilter(records); render(); toggleForm(false);
        }

        function editRecord(index) {
            const records = db.members[currentMember] || [];
            const selectedMonth = document.getElementById('monthFilter').value;
            const selectedStatus = document.getElementById('statusFilter').value;
            
            let filteredRecords = records;
            if (selectedMonth !== 'all') filteredRecords = filteredRecords.filter(r => r.date && r.date.startsWith(selectedMonth));
            if (selectedStatus !== 'all') filteredRecords = filteredRecords.filter(r => getStatusCode(r.sys, r.dia) === selectedStatus);

            const target = filteredRecords[index];
            if (!target) return;

            document.getElementById('recordDate').value = target.date;
            document.getElementById('sysInput').value = target.sys;
            document.getElementById('diaInput').value = target.dia;
            document.getElementById('pulseInput').value = target.pulse;
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitleText').textContent = "編輯";
            document.getElementById('submitBtn').textContent = "更新";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            toggleForm(true);
            document.getElementById('recordForm').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('recordForm').reset();
            document.getElementById('editIndex').value = "-1";
            document.getElementById('formTitleText').textContent = "記錄";
            document.getElementById('submitBtn').textContent = "儲存記錄";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('recordDate').valueAsDate = new Date();
        }

        function deleteRecord(index) {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
                const records = db.members[currentMember] || [];
                const selectedMonth = document.getElementById('monthFilter').value;
                const selectedStatus = document.getElementById('statusFilter').value;

                let filteredRecords = records;
                if (selectedMonth !== 'all') filteredRecords = filteredRecords.filter(r => r.date && r.date.startsWith(selectedMonth));
                if (selectedStatus !== 'all') filteredRecords = filteredRecords.filter(r => getStatusCode(r.sys, r.dia) === selectedStatus);

                const target = filteredRecords[index];
                const realIndex = records.indexOf(target);
                if (realIndex > -1) {
                    db.members[currentMember].splice(realIndex, 1);
                    saveDB(); resetForm(); initMonthFilter(records); render();
                }
            }
        }

        function initMonthFilter(records) {
            const select = document.getElementById('monthFilter');
            const currentVal = select.value;
            const months = [...new Set(records.map(r => r.date ? r.date.substring(0, 7) : null).filter(Boolean))].sort().reverse();
            select.innerHTML = `<option value="all">全部月份 (${records.length})</option>`;
            months.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m;
                let [y, mo] = m.split('-');
                opt.textContent = `${y}/${parseInt(mo)}`;
                select.appendChild(opt);
            });
            if ([...select.options].some(o => o.value === currentVal)) select.value = currentVal;
            else select.value = "all";
        }

        function getStatusCode(sys, dia) {
            if (sys < 90 || dia < 60) return "low";
            if (sys < 120 && dia < 80) return "normal";
            if (sys < 130 && dia < 85) return "normal-high";
            if (sys < 140 || dia < 90) return "stage1";
            return "danger";
        }

        function getStatus(sys, dia) {
            const code = getStatusCode(sys, dia);
            switch(code) {
                case "low": return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-sky-50 text-sky-700 border border-sky-200 dark:bg-sky-950/50 dark:text-sky-400">低血壓</span>';
                case "normal": return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-400">正常</span>';
                case "normal-high": return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-50 text-amber-700 border border-amber-200 dark:bg-amber-950/50 dark:text-amber-400">正常高值</span>';
                case "stage1": return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-orange-50 text-orange-700 border border-orange-200 dark:bg-orange-950/50 dark:text-orange-400">輕度高血壓</span>';
                case "danger": default: return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/50 dark:text-rose-400">偏高/危險</span>';
            }
        }

        function render() {
            const records = db.members[currentMember] || [];
            const monthSelect = document.getElementById('monthFilter');
            const statusSelect = document.getElementById('statusFilter');

            if (monthSelect.options.length <= 1) initMonthFilter(records);
            
            const selectedMonth = monthSelect.value;
            const selectedStatus = statusSelect ? statusSelect.value : 'all';

            let displayRecords = records;
            if (selectedMonth !== 'all') {
                displayRecords = displayRecords.filter(r => r.date && r.date.startsWith(selectedMonth));
            }
            if (selectedStatus !== 'all') {
                displayRecords = displayRecords.filter(r => getStatusCode(r.sys, r.dia) === selectedStatus);
            }

            const count = displayRecords.length;
            let avgSys = 0, avgDia = 0, avgPulse = 0;
            if (count > 0) {
                avgSys = Math.round(displayRecords.reduce((acc, r) => acc + r.sys, 0) / count);
                avgDia = Math.round(displayRecords.reduce((acc, r) => acc + r.dia, 0) / count);
                avgPulse = Math.round(displayRecords.reduce((acc, r) => acc + (r.pulse || 0), 0) / count);
            }

            const statsContainer = document.getElementById('monthlyStats');
            statsContainer.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-slate-400"><i class="fa-solid fa-calendar-days text-rose-500 mr-1"></i> 檢視比數：</span>
                    <span class="font-bold text-rose-500">${count} 次</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-slate-400"><i class="fa-solid fa-chart-pie text-blue-500 mr-1"></i> 平均血壓：</span>
                    <span class="font-bold">${count > 0 ? `${avgSys} /${avgDia} mmHg` : '尚無資料'}</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-slate-400"><i class="fa-solid fa-heart-pulse text-indigo-500 mr-1"></i> 平均脈搏：</span>
                    <span class="font-bold">${count > 0 && avgPulse > 0 ? `${avgPulse} bpm` : '-'}</span>
                </div>
            `;

            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';

            if (displayRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">無符合條件之血壓紀錄</td></tr>`;
            } else {
                displayRecords.forEach((r, idx) => {
                    let tr = document.createElement('tr');
                    tr.className = "border-b border-slate-100 dark:border-slate-700/60 hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition";
                    tr.innerHTML = `
                        <td class="py-2 px-2 text-[11px]">${r.date}</td>
                        <td class="py-2 px-2 font-semibold text-[11px]">${r.sys}/${r.dia}</td>
                        <td class="py-2 px-2 text-[11px]">${r.pulse ? r.pulse : '-'}</td>
                        <td class="py-2 px-2">${getStatus(r.sys, r.dia)}</td>
                        <td class="py-2 px-2 text-right space-x-1">
                            <button onclick="editRecord(${idx})" class="text-slate-400 hover:text-indigo-500 transition cursor-pointer p-1" title="編輯">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteRecord(${idx})" class="text-slate-400 hover:text-rose-500 transition cursor-pointer p-1" title="刪除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            updateChart(records);
        }

        function updateChart(records) {
            const ctx = document.getElementById('bloodPressureChart').getContext('2d');
            
            let filteredRecords = [...records];
            if (currentChartRange !== 'all') {
                const days = Number(currentChartRange);
                const cutoffDate = new Date();
                cutoffDate.setDate(cutoffDate.getDate() - days);
                const cutoffStr = cutoffDate.toISOString().split('T')[0];
                
                filteredRecords = filteredRecords.filter(r => r.date >= cutoffStr);
            }

            const labels = filteredRecords.map(r => r.date);
            const sysData = filteredRecords.map(r => r.sys);
            const diaData = filteredRecords.map(r => r.dia);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '收縮壓', data: sysData, borderColor: '#f43f5e', backgroundColor: '#f43f5e', tension: 0.3, pointRadius: 3 },
                        { label: '舒張壓', data: diaData, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.3, pointRadius: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: false } }
                }
            });
        }

        function exportSingleMemberCSV() {
            const records = db.members[currentMember] || [];
            if (records.length === 0) return alert(`目前「${currentMember}」沒有資料！`);
            let csvContent = "\uFEFF日期,收縮壓(mmHg),舒張壓(mmHg),脈搏(bpm)\r\n";
            records.forEach(r => { csvContent += `${r.date},${r.sys},${r.dia},${r.pulse}\r\n`; });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `${currentMember}_血壓紀錄.csv`);
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function importSingleMemberCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const lines = event.target.result.split(/\r\n|\n/);
                    let count = 0;
                    if (!db.members[currentMember]) db.members[currentMember] = [];
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 3 && cols[0].trim() !== '') {
                            db.members[currentMember].push({ date: cols[0].trim(), sys: Number(cols[1]), dia: Number(cols[2]), pulse: Number(cols[3]) || 0 });
                            count++;
                        }
                    }
                    db.members[currentMember].sort((a, b) => new Date(a.date) - new Date(b.date));
                    saveDB(); resetForm(); initMonthFilter(db.members[currentMember]); render();
                    alert(`🎉 成功匯入 ${count} 筆紀錄！`);
                } catch (error) { alert('讀取失敗！'); }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function exportAllMembersCSV() {
            let total = 0;
            for (let m in db.members) total += (db.members[m] || []).length;
            if (total === 0) return alert('沒有資料可供匯出！');
            let csvContent = "\uFEFF成員名稱,日期,收縮壓(mmHg),舒張壓(mmHg),脈搏(bpm)\r\n";
            for (let member in db.members) {
                (db.members[member] || []).forEach(r => { csvContent += `${member},${r.date},${r.sys},${r.dia},${r.pulse}\r\n`; });
            }
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `全家總表_血壓紀錄.csv`);
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function importAllMembersCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const lines = event.target.result.split(/\r\n|\n/);
                    let count = 0;
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 4 && cols[0].trim() !== '' && cols[1].trim() !== '') {
                            const name = cols[0].trim();
                            if (!db.members[name]) db.members[name] = [];
                            db.members[name].push({ date: cols[1].trim(), sys: Number(cols[2]), dia: Number(cols[3]), pulse: Number(cols[4]) || 0 });
                            count++;
                        }
                    }
                    for (let m in db.members) db.members[m].sort((a, b) => new Date(a.date) - new Date(b.date));
                    saveDB(); resetForm(); initMembers(); initMonthFilter(db.members[currentMember]); render();
                    alert(`🎉 成功智慧匯入共 ${count} 筆！`);
                } catch (error) { alert('總表讀取失敗！'); }
                e.target.value = '';
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
