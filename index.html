<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭血壓記錄系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入自訂樣式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- 標題 -->
        <header class="text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">💓 家庭血壓記錄系統</h1>
            <p class="text-sm text-slate-500 mt-1">輕鬆管理與追蹤家人的每日健康數值</p>
        </header>

        <!-- 人員管理區塊 -->
        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">👥 人員管理</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="newMemberName" placeholder="輸入新成員姓名 (例如: 王小明)" 
                    class="flex-1 px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addMember()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-xl transition">
                    新增人員
                </button>
            </div>
            <!-- 成員切換按鈕清單 -->
            <div id="memberTabs" class="flex flex-wrap gap-2 mt-4"></div>
        </div>

        <!-- 記錄血壓表單 (當有選擇成員時顯示) -->
        <div id="recordSection" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 hidden">
            <h2 class="text-lg font-semibold mb-3">📝 記錄 <span id="currentMemberTitle" class="text-blue-600"></span> 的血壓</h2>
            <form onsubmit="addRecord(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">收縮壓 (SYS mmHg)</label>
                    <input type="number" id="sysInput" required placeholder="例如: 120"
                        class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">舒張壓 (DIA mmHg)</label>
                    <input type="number" id="diaInput" required placeholder="例如: 80"
                        class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">脈搏 (Pulse bpm)</label>
                    <input type="number" id="pulseInput" placeholder="例如: 72"
                        class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="sm:col-span-3 flex justify-end">
                    <button type="submit" 
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-xl transition">
                        儲存記錄
                    </button>
                </div>
            </form>
        </div>

        <!-- 歷史紀錄表格 -->
        <div id="historySection" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">📊 歷史測量紀錄</h2>
                <button onclick="deleteCurrentMember()" class="text-xs text-red-500 hover:underline">刪除目前成員</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">時間</th>
                            <th class="py-3 px-4">收縮壓 / 舒張壓</th>
                            <th class="py-3 px-4">脈搏</th>
                            <th class="py-3 px-4">狀態</th>
                            <th class="py-3 px-4 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="divide-y divide-slate-50 text-sm">
                        <!-- 動態插入紀錄 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 資料結構初始化 (從 localStorage 讀取)
        let db = JSON.parse(localStorage.getItem('blood_pressure_db')) || { members: {} };
        let currentMember = null;

        function saveDB() {
            localStorage.setItem('blood_pressure_db', JSON.stringify(db));
        }

        // 新增人員
        function addMember() {
            const nameInput = document.getElementById('newMemberName');
            const name = nameInput.value.trim();
            if (!name) return alert('請輸入姓名！');
            if (db.members[name]) return alert('此成員已存在！');

            db.members[name] = [];
            saveDB();
            nameInput.value = '';
            renderMembers();
            switchMember(name);
        }

        // 渲染成員標籤按鈕
        function renderMembers() {
            const container = document.getElementById('memberTabs');
            container.innerHTML = '';
            const memberNames = Object.keys(db.members);

            if (memberNames.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400">目前尚無成員，請先新增。</p>';
                document.getElementById('recordSection').classList.add('hidden');
                document.getElementById('historySection').classList.add('hidden');
                return;
            }

            memberNames.forEach(name => {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.className = `px-4 py-2 rounded-xl text-sm font-medium transition ${
                    currentMember === name 
                        ? 'bg-blue-600 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`;
                btn.onclick = () => switchMember(name);
                container.appendChild(btn);
            });

            // 若原本沒有選取成員，預設選取第一個
            if (!currentMember && memberNames.length > 0) {
                switchMember(memberNames[0]);
            }
        }

        // 切換目前檢視的成員
        function switchMember(name) {
            currentMember = name;
            renderMembers();
            document.getElementById('recordSection').classList.remove('hidden');
            document.getElementById('historySection').classList.remove('hidden');
            document.getElementById('currentMemberTitle').textContent = name;
            renderRecords();
        }

        // 新增血壓紀錄
        function addRecord(e) {
            e.preventDefault();
            const sys = parseInt(document.getElementById('sysInput').value);
            const dia = parseInt(document.getElementById('diaInput').value);
            const pulse = document.getElementById('pulseInput').value ? parseInt(document.getElementById('pulseInput').value) : '-';

            const now = new Date();
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const record = { id: Date.now(), time: timeString, sys, dia, pulse };
            db.members[currentMember].unshift(record);
            saveDB();

            document.getElementById('sysInput').value = '';
            document.getElementById('diaInput').value = '';
            document.getElementById('pulseInput').value = '';

            renderRecords();
        }

        // 刪除單筆紀錄
        function deleteRecord(id) {
            db.members[currentMember] = db.members[currentMember].filter(r => r.id !== id);
            saveDB();
            renderRecords();
        }

        // 刪除目前成員
        function deleteCurrentMember() {
            if (confirm(`確定要刪除成員「${currentMember}」及其所有紀錄嗎？`)) {
                delete db.members[currentMember];
                saveDB();
                currentMember = null;
                renderMembers();
            }
        }

        // 判斷血壓狀態
        function getBloodPressureStatus(sys, dia) {
            if (sys < 120 && dia < 80) return { text: '正常', class: 'bg-emerald-50 text-emerald-600' };
            if (sys <= 129 && dia < 80) return { text: '血壓偏高', class: 'bg-amber-50 text-amber-600' };
            if ((sys >= 130 && sys <= 139) || (dia >= 80 && dia <= 89)) return { text: '高血壓第一期', class: 'bg-orange-50 text-orange-600' };
            if (sys >= 140 || dia >= 90) return { text: '高血壓第二期', class: 'bg-rose-50 text-rose-600' };
            return { text: '需注意', class: 'bg-slate-100 text-slate-600' };
        }

        // 渲染歷史紀錄表格
        function renderRecords() {
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';
            const records = db.members[currentMember] || [];

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">尚無血壓紀錄</td></tr>`;
                return;
            }

            records.forEach(r => {
                const status = getBloodPressureStatus(r.sys, r.dia);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/50 transition';
                tr.innerHTML = `
                    <td class="py-3 px-4 text-slate-500 text-xs">${r.time}</td>
                    <td class="py-3 px-4 font-semibold">${r.sys} / ${r.dia} <span class="text-xs font-normal text-slate-400">mmHg</span></td>
                    <td class="py-3 px-4">${r.pulse} <span class="text-xs text-slate-400">${r.pulse !== '-' ? 'bpm' : ''}</span></td>
                    <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium ${status.class}">${status.text}</span></td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="deleteRecord(${r.id})" class="text-slate-400 hover:text-red-500 text-xs transition">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderMembers();
    </script>
</body>
</html>
