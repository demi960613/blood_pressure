<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血壓紀錄追蹤系統</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Chart.js 用於畫圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 SheetJS (xlsx) 用於解析 Excel 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="text-slate-800 dark:text-slate-100 min-h-screen p-4 sm:p-6 transition-colors duration-300 bg-slate-50 dark:bg-slate-900">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- 頂部標題區 -->
        <header class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse text-rose-500"></i> 血壓記錄管理系統
            </h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">輕鬆記錄與追蹤您與家人的健康數據</p>
        </header>

        <!-- 1. 成員管理與該月平均/次數統計面板 -->
        <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-users text-rose-500"></i> 成員管理
                </h2>
                <!-- 新增成員輸入區 -->
                <div class="flex items-center gap-2">
                    <input type="text" id="newMemberInput" placeholder="新成員名字" class="bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                    <button onclick="addMember()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer shrink-0">
                        <i class="fa-solid fa-user-plus mr-1"></i> 新增
                    </button>
                </div>
            </div>

            <!-- 成員列表按鈕 -->
            <div id="memberListContainer" class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                <!-- 動態載入成員 -->
            </div>

            <!-- 該月測量次數與平均血壓統計資訊 -->
            <div id="monthlyStats" class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl flex flex-wrap items-center justify-around gap-4 text-sm">
                <!-- 動態載入統計 -->
            </div>
        </section>

        <!-- 2. 記錄該人員的血壓表單 -->
        <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-nib text-rose-500"></i> 記錄 <span id="currentMemberName" class="text-rose-500 font-bold"></span> 的血壓
            </h2>
            <form id="recordForm" onsubmit="addRecord(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">測量日期 (選填)</label>
                    <input type="date" id="recordDate" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">收縮壓 (SYS mmHg)</label>
                    <input type="number" id="sysInput" placeholder="例如: 120" required min="50" max="250" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">舒張壓 (DIA mmHg)</label>
                    <input type="number" id="diaInput" placeholder="例如: 80" required min="30" max="150" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">脈搏 (Pulse bpm)</label>
                    <input type="number" id="pulseInput" placeholder="例如: 72" min="30" max="200" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div class="sm:col-span-4 flex justify-end mt-2">
                    <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-medium px-6 py-2 rounded-xl text-sm transition shadow-sm cursor-pointer">
                        儲存記錄
                    </button>
                </div>
            </form>
        </section>

        <!-- 3. 歷史測量紀錄清單（包含匯出入按鈕） -->
        <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-indigo-500"></i> 歷史測量紀錄
                </h2>
                <!-- 匯出入按鈕移至此處 -->
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="exportCSV()" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-xl text-sm font-medium transition flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-file-arrow-down"></i> 匯出表格
                    </button>
                    <label class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-xl text-sm font-medium transition flex items-center gap-1.5 cursor-pointer shadow-sm">
                        <i class="fa-solid fa-file-arrow-up"></i> 匯入表格
                        <input type="file" id="importFile" accept=".csv, .xlsx, .xls" onchange="importCSV(event)" class="hidden">
                    </label>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-100 dark:border-slate-700 text-slate-400 font-medium">
                            <th class="py-3 px-4">日期</th>
                            <th class="py-3 px-4">收縮壓 / 舒張壓</th>
                            <th class="py-3 px-4">脈搏</th>
                            <th class="py-3 px-4">狀態</th>
                            <th class="py-3 px-4 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody">
                        <!-- 動態載入紀錄 -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 4. 血壓趨勢圖 -->
        <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-blue-500"></i> 血壓趨勢圖
            </h2>
            <div class="w-full h-64 sm:h-80">
                <canvas id="bloodPressureChart"></canvas>
            </div>
        </section>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let db = JSON.parse(localStorage.getItem('blood_pressure_db')) || {
            members: { "平平": [] },
            currentMember: "平平"
        };
        let currentMember = db.currentMember || "平平";
        let chartInstance = null;

        window.onload = function() {
            document.getElementById('recordDate').valueAsDate = new Date();
            initMembers();
            render();
        };

        function initMembers() {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = '';
            
            if (!db.members[currentMember]) {
                const firstKey = Object.keys(db.members)[0];
                currentMember = firstKey || "平平";
                db.currentMember = currentMember;
            }

            for (let member in db.members) {
                let isSelected = (member === currentMember);
                let btnWrapper = document.createElement('div');
                btnWrapper.className = "inline-flex items-center bg-slate-100 dark:bg-slate-700 rounded-xl p-1 border " + 
                    (isSelected ? "border-rose-500 shadow-sm" : "border-transparent");

                let selectBtn = document.createElement('button');
                selectBtn.type = "button";
                selectBtn.className = `px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer flex items-center gap-1.5 ${
                    isSelected ? 'bg-rose-500 text-white' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600'
                }`;
                selectBtn.innerHTML = `<i class="fa-solid fa-user text-xs"></i> ${member}`;
                selectBtn.onclick = () => switchMember(member);
                btnWrapper.appendChild(selectBtn);

                let renameBtn = document.createElement('button');
                renameBtn.type = "button";
                renameBtn.className = "px-2 py-1.5 text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400 text-xs transition cursor-pointer";
                renameBtn.innerHTML = `<i class="fa-solid fa-pen"></i>`;
                renameBtn.title = "重新命名";
                renameBtn.onclick = (e) => {
                    e.stopPropagation();
                    renameMember(member);
                };
                btnWrapper.appendChild(renameBtn);

                if (Object.keys(db.members).length > 1) {
                    let deleteBtn = document.createElement('button');
                    deleteBtn.type = "button";
                    deleteBtn.className = "px-2 py-1.5 text-slate-400 hover:text-rose-500 text-xs transition cursor-pointer";
                    deleteBtn.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
                    deleteBtn.title = "刪除成員";
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteMember(member);
                    };
                    btnWrapper.appendChild(deleteBtn);
                }

                container.appendChild(btnWrapper);
            }
            document.getElementById('currentMemberName').textContent = currentMember;
        }

        function switchMember(member) {
            currentMember = member;
            db.currentMember = currentMember;
            saveDB();
            render();
        }

        function addMember() {
            const input = document.getElementById('newMemberInput');
            const name = input.value.trim();

            if (!name) {
                alert('請輸入成員名字！');
                return;
            }
            if (db.members[name]) {
                alert('此成員已經存在！');
                return;
            }

            db.members[name] = [];
            currentMember = name;
            db.currentMember = currentMember;
            saveDB();
            input.value = '';
            render();
        }

        function renameMember(oldName) {
            const newName = prompt(`請輸入「${oldName}」的新名字：`, oldName);
            if (!newName) return;
            const trimmedNewName = newName.trim();

            if (trimmedNewName === "") {
                alert("名字不能為空白！");
                return;
            }
            if (db.members[trimmedNewName]) {
                alert("此名字已經存在！");
                return;
            }

            db.members[trimmedNewName] = db.members[oldName];
            delete db.members[oldName];

            currentMember = trimmedNewName;
            db.currentMember = currentMember;
            saveDB();
            render();
        }

        function deleteMember(member) {
            if (confirm(`確定要刪除成員「${member}」及其所有血壓紀錄嗎？`)) {
                delete db.members[member];
                const remaining = Object.keys(db.members);
                currentMember = remaining[0];
                db.currentMember = currentMember;
                saveDB();
                render();
            }
        }

        function saveDB() {
            localStorage.setItem('blood_pressure_db', JSON.stringify(db));
        }

        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('recordDate').value;
            const sys = Number(document.getElementById('sysInput').value);
            const dia = Number(document.getElementById('diaInput').value);
            const pulse = Number(document.getElementById('pulseInput').value) || 0;

            if (!db.members[currentMember]) {
                db.members[currentMember] = [];
            }

            db.members[currentMember].push({ date, sys, dia, pulse });
            db.members[currentMember].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            saveDB();
            render();
            
            document.getElementById('sysInput').value = '';
            document.getElementById('diaInput').value = '';
            document.getElementById('pulseInput').value = '';
        }

        function deleteRecord(index) {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
                db.members[currentMember].splice(index, 1);
                saveDB();
                render();
            }
        }

        function getStatus(sys, dia) {
            if (sys < 120 && dia < 80) return '<span class="text-emerald-500 font-medium">正常</span>';
            if (sys < 130 && dia < 85) return '<span class="text-amber-500 font-medium">正常高值</span>';
            if (sys < 140 || dia < 90) return '<span class="text-orange-500 font-medium">輕度高血壓</span>';
            return '<span class="text-rose-500 font-medium">偏高/危險</span>';
        }

        function render() {
            initMembers();
            const records = db.members[currentMember] || [];
            
            const now = new Date();
            const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            
            const monthRecords = records.filter(r => r.date && r.date.startsWith(currentYearMonth));
            const count = monthRecords.length;
            
            let avgSys = 0, avgDia = 0, avgPulse = 0;
            if (count > 0) {
                const sumSys = monthRecords.reduce((acc, r) => acc + r.sys, 0);
                const sumDia = monthRecords.reduce((acc, r) => acc + r.dia, 0);
                const sumPulse = monthRecords.reduce((acc, r) => acc + (r.pulse || 0), 0);
                avgSys = Math.round(sumSys / count);
                avgDia = Math.round(sumDia / count);
                avgPulse = Math.round(sumPulse / count);
            }

            const statsContainer = document.getElementById('monthlyStats');
            statsContainer.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-rose-500"></i>
                    <span class="text-slate-500 dark:text-slate-400">本月測量次數：</span>
                    <span class="font-bold text-base text-rose-500">${count} 次</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-blue-500"></i>
                    <span class="text-slate-500 dark:text-slate-400">本月平均血壓：</span>
                    <span class="font-bold text-base">${count > 0 ? `${avgSys} /${avgDia} mmHg` : '尚無資料'}</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-heart-pulse text-indigo-500"></i>
                    <span class="text-slate-500 dark:text-slate-400">平均脈搏：</span>
                    <span class="font-bold text-base">${count > 0 && avgPulse > 0 ? `${avgPulse} bpm` : '-'}</span>
                </div>
            `;

            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">目前尚無血壓紀錄</td></tr>`;
            } else {
                records.forEach((r, idx) => {
                    let tr = document.createElement('tr');
                    tr.className = "border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50/50 dark:hover:bg-slate-700/50 transition";
                    tr.innerHTML = `
                        <td class="py-3 px-4">${r.date}</td>
                        <td class="py-3 px-4 font-semibold">${r.sys} / ${r.dia}</td>
                        <td class="py-3 px-4">${r.pulse ? r.pulse + ' bpm' : '-'}</td>
                        <td class="py-3 px-4">${getStatus(r.sys, r.dia)}</td>
                        <td class="py-3 px-4 text-right">
                            <button onclick="deleteRecord(${idx})" class="text-slate-400 hover:text-rose-500 transition cursor-pointer">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            updateChart(records);
        }

        function updateChart(records) {
            const ctx = document.getElementById('bloodPressureChart').getContext('2d');
            const labels = records.map(r => r.date);
            const sysData = records.map(r => r.sys);
            const diaData = records.map(r => r.dia);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '收縮壓 (SYS)',
                            data: sysData,
                            borderColor: '#f43f5e',
                            backgroundColor: '#f43f5e',
                            tension: 0.3
                        },
                        {
                            label: '舒張壓 (DIA)',
                            data: diaData,
                            borderColor: '#3b82f6',
                            backgroundColor: '#3b82f6',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                reader.onload = function(event) {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        let importedCount = 0;
                        
                        if (!db.members[currentMember]) {
                            db.members[currentMember] = [];
                        }

                        for (let i = 3; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row) continue;
                            
                            if (row[0] !== undefined && row[1] !== undefined && row[2] !== undefined) {
                                const dayNum = parseInt(row[0]);
                                if (!isNaN(dayNum) && !isNaN(Number(row[1]))) {
                                    const dateStr = `2026-07-${String(dayNum).padStart(2, '0')}`;
                                    db.members[currentMember].push({
                                        date: dateStr,
                                        sys: Number(row[1]),
                                        dia: Number(row[2]),
                                        pulse: Number(row[3]) || 0
                                    });
                                    importedCount++;
                                }
                            }
                            
                            if (row[4] !== undefined && row[5] !== undefined && row[6] !== undefined) {
                                const dayNum = parseInt(row[4]);
                                if (!isNaN(dayNum) && !isNaN(Number(row[5]))) {
                                    const dateStr = `2026-07-${String(dayNum).padStart(2, '0')}`;
                                    db.members[currentMember].push({
                                        date: dateStr,
                                        sys: Number(row[5]),
                                        dia: Number(row[6]),
                                        pulse: Number(row[7]) || 0
                                    });
                                    importedCount++;
                                }
                            }
                        }
                        
                        db.members[currentMember].sort((a, b) => new Date(a.date) - new Date(b.date));
                        saveDB();
                        render();
                        
                        alert(`🎉 成功匯入 ${importedCount} 筆血壓紀錄！`);
                    } catch (error) {
                        console.error(error);
                        alert('匯入失敗，檔案格式可能有誤！');
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                reader.onload = function(event) {
                    try {
                        const text = event.target.result;
                        const lines = text.split(/\r\n|\n/);
                        let importedCount = 0;
                        for (let i = 1; i < lines.length; i++) {
                            const cols = lines[i].split(',');
                            if (cols.length >= 3 && cols[0].trim() !== '') {
                                db.members[currentMember].push({
                                    date: cols[0].trim(),
                                    sys: Number(cols[1]),
                                    dia: Number(cols[2]),
                                    pulse: Number(cols[3]) || 0
                                });
                                importedCount++;
                            }
                        }
                        db.members[currentMember].sort((a, b) => new Date(a.date) - new Date(b.date));
                        saveDB();
                        render();
                        alert(`🎉 成功匯入 ${importedCount} 筆血壓紀錄！`);
                    } catch (error) {
                        alert('CSV 讀取失敗！');
                    }
                };
                reader.readAsText(file);
            }
        }

        function exportCSV() {
            const records = db.members[currentMember] || [];
            if (records.length === 0) return alert('目前沒有資料可供匯出！');

            let csvContent = "\uFEFF日期,收縮壓(mmHg),舒張壓(mmHg),脈搏(bpm)\r\n";
            records.forEach(r => {
                csvContent += `${r.date},${r.sys},${r.dia},${r.pulse}\r\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `${currentMember}_血壓紀錄.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
