<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭血壓記錄系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <!-- Chart.js 趨勢圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 dark:text-slate-100 min-h-screen p-4 sm:p-6 transition-colors duration-300">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- 頂端標題與控制列 -->
        <header class="flex justify-between items-center bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">💓 家庭血壓記錄系統</h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">輕鬆管理與追蹤家人的每日健康數值</p>
            </div>
            <!-- 深色模式切換按鈕 -->
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition text-slate-600 dark:text-slate-200">
                <span id="darkModeIcon">🌙</span>
            </button>
        </header>

        <!-- 人員管理區塊 -->
        <div class="bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">👥 人員管理</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="newMemberName" placeholder="輸入新成員姓名 (例如: 王小明)" 
                    class="flex-1 px-4 py-2 border border-slate-200 dark:border-slate-600 bg-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-2">
                    <button onclick="addMember()" 
                        class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-xl transition shadow-sm">
                        新增人員
                    </button>
                    <button onclick="deleteCurrentMember()" id="deleteMemberBtn" class="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-700 text-white font-medium px-4 py-2 rounded-xl transition shadow-sm hidden">
                        刪除目前成員
                    </button>
                </div>
            </div>
            <!-- 成員切換 Radio 選項群組清單 -->
            <div id="memberTabs" class="flex flex-wrap gap-3 mt-4"></div>
        </div>

        <!-- 數據統計小卡 (選擇成員後顯示) -->
        <div id="statsSection" class="grid grid-cols-1 sm:grid-cols-3 gap-4 hidden">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                <p class="text-xs font-medium text-slate-400">平均收縮壓 (SYS)</p>
                <p id="avgSys" class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1">-- <span class="text-xs font-normal text-slate-400">mmHg</span></p>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                <p class="text-xs font-medium text-slate-400">平均舒張壓 (DIA)</p>
                <p id="avgDia" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">-- <span class="text-xs font-normal text-slate-400">mmHg</span></p>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                <p class="text-xs font-medium text-slate-400">總測量次數</p>
                <p id="totalCount" class="text-2xl font-bold text-slate-700 dark:text-slate-200 mt-1">-- <span class="text-xs font-normal text-slate-400">次</span></p>
            </div>
        </div>

        <!-- 血壓趨勢圖表區塊 -->
        <div id="chartSection" class="bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <h2 class="text-lg font-semibold">📈 血壓趨勢圖</h2>
                <!-- 月份切換控制列 -->
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-xl">
                    <button onclick="changeMonth(-1)" class="text-slate-600 dark:text-slate-300 hover:text-blue-600 font-bold px-1.5">&lt;</button>
                    <span id="currentMonthDisplay" class="text-xs font-semibold text-slate-700 dark:text-slate-200 min-w-[80px] text-center">2026-10</span>
                    <button onclick="changeMonth(1)" class="text-slate-600 dark:text-slate-300 hover:text-blue-600 font-bold px-1.5">&gt;</button>
                </div>
            </div>
            <div class="relative h-64 w-full">
                <canvas id="bloodPressureChart"></canvas>
            </div>
        </div>

        <!-- 記錄血壓表單 -->
        <div id="recordSection" class="bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 hidden">
            <h2 class="text-lg font-semibold mb-3">📝 記錄 <span id="currentMemberTitle" class="text-blue-600 dark:text-blue-400"></span> 的血壓</h2>
            <form onsubmit="addRecord(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">測量日期 (選填)</label>
                    <input type="date" id="recordDateInput"
                        class="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 bg-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs sm:text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">收縮壓 (SYS mmHg)</label>
                    <input type="number" id="sysInput" required min="50" max="260" placeholder="例如: 120"
                        class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">舒張壓 (DIA mmHg)</label>
                    <input type="number" id="diaInput" required min="30" max="180" placeholder="例如: 80"
                        class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">脈搏 (Pulse bpm)</label>
                    <input type="number" id="pulseInput" min="30" max="220" placeholder="例如: 72"
                        class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="sm:col-span-4 flex justify-end">
                    <button type="submit" 
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-xl transition shadow-sm">
                        儲存記錄
                    </button>
                </div>
            </form>
        </div>

        <!-- 歷史紀錄表格 -->
        <div id="historySection" class="bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <h2 class="text-lg font-semibold">📊 歷史測量紀錄</h2>
                <div class="flex items-center gap-2">
                    <!-- 匯出表格按鈕 -->
                    <button onclick="exportCSV()" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-3 py-1.5 rounded-lg transition font-medium">匯出表格</button>
                    <!-- 匯入表格按鈕與隱藏的檔案上傳框 -->
                    <label class="text-xs bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-400 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition font-medium cursor-pointer">
                        匯入表格
                        <input type="file" id="importCsvInput" accept=".csv" class="hidden" onchange="importCSV(event)">
                    </label>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 dark:border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">日期</th>
                            <th class="py-3 px-4">收縮壓 / 舒張壓</th>
                            <th class="py-3 px-4">脈搏</th>
                            <th class="py-3 px-4">狀態</th>
                            <th class="py-3 px-4 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-sm">
                        <!-- 動態插入紀錄 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('blood_pressure_db')) || { members: {} };
        let currentMember = null;
        let bpChart = null;
        
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth() + 1;

        const todayStr = currentDate.toISOString().split('T')[0];
        document.getElementById('recordDateInput').max = todayStr;

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('darkModeIcon').textContent = '☀️';
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('darkModeIcon').textContent = isDark ? '☀️' : '🌙';
            if (bpChart) updateChart();
        }

        function saveDB() {
            localStorage.setItem('blood_pressure_db', JSON.stringify(db));
        }

        function addMember() {
            const nameInput = document.getElementById('newMemberName');
            const name = nameInput.value.trim();
            if (!name) return alert('請輸入姓名！');
            if (db.members[name]) return alert('此成員已存在！');

            db.members[name] = [];
            saveDB();
            nameInput.value = '';
            renderMembers();
            switchMember(name);
        }

        function renderMembers() {
            const container = document.getElementById('memberTabs');
            container.innerHTML = '';
            const memberNames = Object.keys(db.members);
            const deleteBtn = document.getElementById('deleteMemberBtn');

            if (memberNames.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400">目前尚無成員，請先新增。</p>';
                deleteBtn.classList.add('hidden');
                ['statsSection', 'chartSection', 'recordSection', 'historySection'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
                return;
            }

            deleteBtn.classList.remove('hidden');

            memberNames.forEach(name => {
                const label = document.createElement('label');
                label.className = `flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition border ${
                    currentMember === name 
                        ? 'bg-blue-50 border-blue-500 text-blue-700 dark:bg-blue-950/40 dark:border-blue-500 dark:text-blue-300 shadow-sm' 
                        : 'bg-slate-50 border-slate-200 text-slate-600 dark:bg-slate-700/50 dark:border-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'
                }`;

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'memberRadio';
                radio.value = name;
                radio.checked = (currentMember === name);
                radio.className = 'text-blue-600 focus:ring-blue-500 dark:bg-slate-800 dark:border-slate-600';
                radio.onchange = () => switchMember(name);

                const span = document.createElement('span');
                span.textContent = name;

                label.appendChild(radio);
                label.appendChild(span);
                container.appendChild(label);
            });

            if (!currentMember && memberNames.length > 0) {
                switchMember(memberNames[0]);
            }
        }

        function switchMember(name) {
            currentMember = name;
            renderMembers();
            ['statsSection', 'chartSection', 'recordSection', 'historySection'].forEach(id => {
                document.getElementById(id).classList.remove('hidden');
            });
            document.getElementById('currentMemberTitle').textContent = name;
            renderStats();
            renderRecords();
            updateChart();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            } else if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderStats();
            renderRecords();
            updateChart();
        }

        function getFilteredRecords() {
            const records = db.members[currentMember] || [];
            const monthStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            document.getElementById('currentMonthDisplay').textContent = monthStr;
            return records.filter(r => r.time.startsWith(monthStr));
        }

        function addRecord(e) {
            e.preventDefault();
            const sys = parseInt(document.getElementById('sysInput').value);
            const dia = parseInt(document.getElementById('diaInput').value);
            const pulseInputVal = document.getElementById('pulseInput').value;
            const pulse = pulseInputVal ? parseInt(pulseInputVal) : '-';

            if (sys <= dia) {
                alert('⚠️ 錯誤：收縮壓 (SYS) 必須大於舒張壓 (DIA)！');
                return;
            }

            if (pulseInputVal !== '' && (pulse < 30 || pulse > 220)) {
                alert('⚠️ 警告：脈搏數值超出常理範圍 (30 - 220 bpm)，請重新確認！');
                return;
            }
            
            const dateInputValue = document.getElementById('recordDateInput').value;
            let dateString;

            if (dateInputValue) {
                dateString = dateInputValue;
            } else {
                const now = new Date();
                dateString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            }

            const [recYear, recMonth] = dateString.split('-').map(Number);
            currentYear = recYear;
            currentMonth = recMonth;

            const existingRecordIndex = db.members[currentMember].findIndex(r => r.time === dateString);
            if (existingRecordIndex !== -1) {
                const confirmReplace = confirm(`⚠️ 提示：${dateString} 已經有血壓記錄了，請問是否要取代舊的記錄？`);
                if (!confirmReplace) {
                    document.getElementById('sysInput').value = '';
                    document.getElementById('diaInput').value = '';
                    document.getElementById('pulseInput').value = '';
                    return; 
                }
                db.members[currentMember].splice(existingRecordIndex, 1);
            }

            const record = { id: Date.now(), time: dateString, sys, dia, pulse };
            db.members[currentMember].unshift(record);
            saveDB();

            document.getElementById('recordDateInput').value = '';
            document.getElementById('sysInput').value = '';
            document.getElementById('diaInput').value = '';
            document.getElementById('pulseInput').value = '';

            renderStats();
            renderRecords();
            updateChart();
        }

        function deleteRecord(id) {
            db.members[currentMember] = db.members[currentMember].filter(r => r.id !== id);
            saveDB();
            renderStats();
            renderRecords();
            updateChart();
        }

        function deleteCurrentMember() {
            if (confirm(`確定要刪除成員「${currentMember}」及其所有紀錄嗎？`)) {
                delete db.members[currentMember];
                saveDB();
                currentMember = null;
                renderMembers();
            }
        }

        function renderStats() {
            const records = getFilteredRecords();
            if (records.length === 0) {
                document.getElementById('avgSys').innerHTML = `-- <span class="text-xs font-normal text-slate-400">mmHg</span>`;
                document.getElementById('avgDia').innerHTML = `-- <span class="text-xs font-normal text-slate-400">mmHg</span>`;
                document.getElementById('totalCount').innerHTML = `0 <span class="text-xs font-normal text-slate-400">次</span>`;
                return;
            }

            const totalSys = records.reduce((sum, r) => sum + r.sys, 0);
            const totalDia = records.reduce((sum, r) => sum + r.dia, 0);
            document.getElementById('avgSys').innerHTML = `${Math.round(totalSys / records.length)} <span class="text-xs font-normal text-slate-400">mmHg</span>`;
            document.getElementById('avgDia').innerHTML = `${Math.round(totalDia / records.length)} <span class="text-xs font-normal text-slate-400">mmHg</span>`;
            document.getElementById('totalCount').innerHTML = `${records.length} <span class="text-xs font-normal text-slate-400">次</span>`;
        }

        function getBloodPressureStatus(sys, dia) {
            if (sys < 90 || dia < 60) {
                return { text: '低血壓', class: 'bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-400' };
            }
            if (sys < 120 && dia < 80) {
                return { text: '正常血壓', class: 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50 dark:text-emerald-400' };
            }
            if ((sys >= 120 && sys <= 139) || (dia >= 80 && dia <= 89)) {
                return { text: '高血壓前期', class: 'bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400' };
            }
            if ((sys >= 140 && sys <= 159) || (dia >= 90 && dia <= 99)) {
                return { text: '第一期高血壓', class: 'bg-orange-50 text-orange-600 dark:bg-orange-950/50 dark:text-orange-400' };
            }
            if (sys >= 160 || dia >= 100) {
                return { text: '第二期高血壓', class: 'bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400' };
            }
            return { text: '需注意', class: 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300' };
        }

        function renderRecords() {
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';
            const records = getFilteredRecords();

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">本月尚無血壓紀錄</td></tr>`;
                return;
            }

            records.forEach(r => {
                const status = getBloodPressureStatus(r.sys, r.dia);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition';
                tr.innerHTML = `
                    <td class="py-3 px-4 text-slate-500 dark:text-slate-400 text-xs">${r.time}</td>
                    <td class="py-3 px-4 font-semibold">${r.sys} / ${r.dia} <span class="text-xs font-normal text-slate-400">mmHg</span></td>
                    <td class="py-3 px-4">${r.pulse} <span class="text-xs text-slate-400">${r.pulse !== '-' ? 'bpm' : ''}</span></td>
                    <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium ${status.class}">${status.text}</span></td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="deleteRecord(${r.id})" class="text-slate-400 hover:text-red-500 text-xs transition">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateChart() {
            const records = [...getFilteredRecords()].reverse();
            const ctx = document.getElementById('bloodPressureChart').getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');

            const labels = records.map(r => r.time);
            const sysData = records.map(r => r.sys);
            const diaData = records.map(r => r.dia);

            if (bpChart) bpChart.destroy();

            bpChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '收縮壓 (SYS)',
                            data: sysData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '舒張壓 (DIA)',
                            data: diaData,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: isDark ? '#cbd5e1' : '#475569',
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: isDark ? '#94a3b8' : '#64748b', font: { size: 10 } },
                            grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }
                        },
                        y: {
                            ticks: { color: isDark ? '#94a3b8' : '#64748b', font: { size: 10 } },
                            grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }
                        }
                    }
                }
            });
        }

        function exportCSV() {
            const records = db.members[currentMember] || [];
            if (records.length === 0) return alert('目前沒有資料可供匯出！');

            let csvContent = "\uFEFF日期,收縮壓(mmHg),舒張壓(mmHg),脈搏(bpm)\r\n";
            records.forEach(r => {
                csvContent += `"${r.time}",${r.sys},${r.dia},${r.pulse}\r\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `${currentMember}_血壓紀錄.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const text = event.target.result;
                    const lines = text.split(/\r\n|\n/);
                    let importedCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                        if (cols.length >= 3) {
                            const time = cols[0].replace(/"/g, '').trim();
                            const sys = parseInt(cols[1].replace(/"/g, '').trim());
                            const dia = parseInt(cols[2].replace(/"/g, '').trim());
                            const pulseVal = cols[3] ? cols[3].replace(/"/g, '').trim() : '-';
                            const pulse = (pulseVal === '-' || isNaN(pulseVal)) ? '-' : parseInt(pulseVal);

                            if (time && !isNaN(sys) && !isNaN(dia)) {
                                db.members[currentMember] = db.members[currentMember].filter(r => r.time !== time);
                                db.members[currentMember].unshift({
                                    id: Date.now() + i,
                                    time,
                                    sys,
                                    dia,
                                    pulse
                                });
                                importedCount++;
                            }
                        }
                    }

                    db.members[currentMember].sort((a, b) => new Date(b.time) - new Date(a.time));
                    saveDB();
                    renderStats();
                    renderRecords();
                    updateChart();

                    alert(`🎉 成功匯入 ${importedCount} 筆血壓紀錄！`);
                } catch (err) {
                    console.error(err);
                    alert('⚠️ 匯入失敗：檔案格式可能不正確，請確認是本系統產出的格式。');
                } finally {
                    e.target.value = '';
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        renderMembers();
    </script>
</body>
</html>
